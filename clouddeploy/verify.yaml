# verify.yaml — Cloud Deploy VERIFY action for chora-model-gateway.
#
# Cloud Build config that runs as the Cloud Deploy VERIFY step AFTER the dev
# rollout's DEPLOY action completes. If verify fails, the rollout is marked
# FAILED and any downstream Automation (e.g., promote-to-prod) is blocked.
#
# Canonical smoke: gRPC health check against the freshly deployed pod via the
# in-cluster ClusterIP service on port :9090 (ADR-140 canonical gRPC port
# named `grpc` w/ appProtocol=grpc).
#
# Evidence: JUnit XML uploaded to
#   gs://chora-489812-cloudbuild-evidence/chora-model-gateway/$SHORT_SHA/verify/
# for the O+ Observability+ surface to pick up.
#
# NOTE: This file is the documentary/standalone Cloud Build run. The Cloud
# Deploy VERIFY action actually executes the `verify` block in
# `services/chora-model-gateway/clouddeploy/skaffold.yaml` per the v4beta11
# KubernetesCluster execution mode — both share the same smoke RPC so the
# evidence is consistent.

steps:
  - id: grpc-health-check
    name: fullstorydev/grpcurl:v1.8.9-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        SVC=chora-model-gateway
        NS=${_NAMESPACE_DEV:-ai-kernel-dev}
        ADDR="${SVC}.${NS}.svc.cluster.local:9090"
        mkdir -p /workspace/reports
        START_TS=$(date -u +%s)
        if grpcurl -plaintext -connect-timeout 10 -max-time 30 "$ADDR" grpc.health.v1.Health/Check > /workspace/reports/grpc-health-output.txt 2>&1; then
          DURATION=$(( $(date -u +%s) - START_TS ))
          cat > /workspace/reports/${SVC}-verify.xml <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <testsuites name="${SVC}-verify" tests="1" failures="0" errors="0" time="${DURATION}">
          <testsuite name="${SVC}.smoke" tests="1" failures="0" errors="0" time="${DURATION}">
            <testcase classname="${SVC}.smoke" name="grpc.health.v1.Health/Check" time="${DURATION}"/>
          </testsuite>
        </testsuites>
        EOF
          echo "VERIFY PASS: $ADDR grpc.health.v1.Health/Check"
        else
          DURATION=$(( $(date -u +%s) - START_TS ))
          MSG=$(cat /workspace/reports/grpc-health-output.txt | head -20 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
          cat > /workspace/reports/${SVC}-verify.xml <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <testsuites name="${SVC}-verify" tests="1" failures="1" errors="0" time="${DURATION}">
          <testsuite name="${SVC}.smoke" tests="1" failures="1" errors="0" time="${DURATION}">
            <testcase classname="${SVC}.smoke" name="grpc.health.v1.Health/Check" time="${DURATION}">
              <failure message="grpc health check failed against ${ADDR}">${MSG}</failure>
            </testcase>
          </testsuite>
        </testsuites>
        EOF
          echo "VERIFY FAIL: $ADDR grpc.health.v1.Health/Check"
          exit 1
        fi

  - id: upload-evidence
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gsutil -m cp /workspace/reports/chora-model-gateway-verify.xml \
          "gs://chora-489812-cloudbuild-evidence/chora-model-gateway/${SHORT_SHA:-unknown}/verify/chora-model-gateway-verify.xml"
        gsutil -m cp /workspace/reports/grpc-health-output.txt \
          "gs://chora-489812-cloudbuild-evidence/chora-model-gateway/${SHORT_SHA:-unknown}/verify/grpc-health-output.txt" || true

substitutions:
  _NAMESPACE_DEV: ai-kernel-dev

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
