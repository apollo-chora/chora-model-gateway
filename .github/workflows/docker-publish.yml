name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: walfa/chora-model-gateway

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # The service's go.mod replaces (`../chora-contracts/gen/go`,
      # `../chora-common`) resolve against FLAT sibling directories, so the
      # three repos are checked out as neighbours and the build runs from the
      # workspace root. Checking this repo out at the root (the previous shape)
      # failed on every run: `COPY services/chora-model-gateway/: not found`.
      - name: Check out this service
        uses: actions/checkout@v7
        with:
          path: chora-model-gateway

      - name: Check out chora-common (replaced by ../chora-common)
        uses: actions/checkout@v7
        with:
          repository: apollo-chora/chora-common
          path: chora-common

      - name: Check out chora-contracts (replaced by ../chora-contracts/gen/go)
        uses: actions/checkout@v7
        with:
          repository: apollo-chora/chora-contracts
          path: chora-contracts

      # The build context is this assembled workspace, so the .dockerignore
      # that applies is the one at its root — without this the three .git
      # directories ride along in the context.
      - name: Trim the build context
        run: printf '%s\n' '.git' '**/.git' > .dockerignore

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: walfa
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: chora-model-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=chora-model-gateway
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
