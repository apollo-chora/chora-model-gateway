[project]
name = "chora-model-gateway"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "blacksheep>=2.6.3",
    "granian>=2.8.4",
    "structlog>=26.1.0",
    "strands-agents>=1.57.2",
    "openai>=3.24.0",
    "anthropic>=1.11.0",
    "asyncpg>=0.31.0",
    "pyyaml>=6.0.3",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "chora-contracts",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "bandit>=1.9.4",
    "grpcio-tools>=1.84.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
    "types-grpcio>=1.84.0.20260928",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["model_gateway_service_pb2.py", "model_gateway_service_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# The protobuf stubs are generated at build time and are not present in the
# source tree, so ruff must be told they are first-party to sort their
# imports consistently with and without the generated files.
known-first-party = ["model_gateway_service_pb2", "model_gateway_service_pb2_grpc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
exclude = "(model_gateway_service_pb2|model_gateway_service_pb2_grpc)\\.py$"
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "blacksheep.*"]
ignore_missing_imports = true

# boto3 ships without a py.typed marker, so mypy refuses to analyse it. It is
# imported lazily inside the grounding blob-fetch path (app/runtime.py) purely
# to read the object store, and the test path never imports it.
[[tool.mypy.overrides]]
module = ["boto3.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The protobuf stubs are generated at build time and are not present in the
# source tree. When they are absent mypy cannot find the module; when they
# present their classes are injected dynamically. Both cases are handled here.
[[tool.mypy.overrides]]
module = ["model_gateway_service_pb2", "model_gateway_service_pb2_grpc"]
ignore_missing_imports = true
follow_imports = "skip"

# The chora-contracts bindings are generated by buf and ship without a py.typed
# marker, so mypy cannot type them. They are consumed dynamically (see
# app/contracts.py).
[[tool.mypy.overrides]]
module = ["chora_contracts_gen.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.uv.sources]
chora-contracts = { path = "../chora-contracts" }
