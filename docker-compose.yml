name: chora-model-gateway

# The model gateway owns NO database and NO migrations. It is a privileged
# client of the chora_observability database, which is owned by chora-observability.
# The gateway connects as chora_observability_app_rw (NOBYPASSRLS).
#
# Recommended: run from the Chora root Compose, which owns the DB lifecycle:
#   postgres -> observability-migrate -> observability -> model-gateway
#
# Advanced standalone: point CHORA_DATABASE_URL at a migrated chora_observability DB:
#   docker run -e CHORA_DATABASE_URL=postgres://chora_observability_app_rw:...@host:5432/chora_observability ...

services:
  gateway:
    build:
      context: .
      additional_contexts:
        chora-contracts: ../chora-contracts
    image: walfa/chora-model-gateway:latest
    restart: unless-stopped
    ports: ["${GATEWAY_HTTP_PORT:-8080}:8080", "${GATEWAY_GRPC_PORT:-9090}:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      CHORA_DATABASE_URL: ${CHORA_DATABASE_URL:-postgres://chora_observability_app_rw:chora@postgres:5432/chora_observability?sslmode=disable}
      CHORA_MODEL_REGISTRY: /app/config/models.yaml
      CHORA_HTTP_PORT: "8080"
      CHORA_GRPC_PORT: "9090"
      CHORA_DEFAULT_TENANT_ID: ${CHORA_DEFAULT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      CHORA_DEFAULT_GCID: ${CHORA_DEFAULT_GCID:-00000000-0000-7000-8000-000000000002}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_FORMAT: ${TEXT_LLM_FORMAT:-responses}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_SUPPORT_GROUNDING: ${TEXT_LLM_SUPPORT_GROUNDING:-false}
      IMAGE_LLM_BASE_URL: ${IMAGE_LLM_BASE_URL:-}
      IMAGE_LLM_FORMAT: ${IMAGE_LLM_FORMAT:-images}
      IMAGE_LLM_MODEL: ${IMAGE_LLM_MODEL:-}
      IMAGE_LLM_API_KEY: ${IMAGE_LLM_API_KEY:-}
      EMBEDDING_LLM_BASE_URL: ${EMBEDDING_LLM_BASE_URL:-}
      EMBEDDING_LLM_FORMAT: ${EMBEDDING_LLM_FORMAT:-embeddings}
      EMBEDDING_LLM_MODEL: ${EMBEDDING_LLM_MODEL:-}
      EMBEDDING_LLM_API_KEY: ${EMBEDDING_LLM_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-exa}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes: ["./config/models.yaml:/app/config/models.yaml:ro"]
